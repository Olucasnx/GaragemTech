R(0,36,W2,20,'#6b4a2e');for(let x=0;x<W2;x+=12)R(x,36,1,20,'#4e3420');R(0,36,W2,2,'#8a5f3a');R(0,38,W2,1,'#3d2917');
[40,112].forEach(x=>{R(x,16,2,6,'#5a4a3a');R(x-1,14,4,2,'#8a8fa8');const f=(T/120|0)%2;R(x-1,10-f,4,4+f,'#ff9a3c');R(x,9-f,2,4,'#ffd23f');g.globalAlpha=.12;R(x-10,4,22,22,'#ffb347');g.globalAlpha=1});

[14,74,134].forEach(bx=>{R(bx,0,11,22,sd(col,-45));R(bx+1,0,9,22,col);R(bx,22,5,3,sd(col,-45));R(bx+6,22,5,3,sd(col,-45));R(bx+1,22,4,2,col);R(bx+6,22,4,2,col);R(bx-1,0,13,2,'#8a8fa8');g.drawImage(eb,bx+1,5)});
for(let k=0;k<n;k++){const x=n>1?14+k*(132/(n-1)):80,y=50-((((T/500)|0)+k)%2);R(x-4,50,8,1,'rgba(0,0,0,.3)');
if(k==L)person(x,y,PSK[s.pf.sk],PSH[s.pf.sh],PPA[s.pf.pa],0,PHR[s.pf.hr],s.pf.hs,k<L?1:-1,s.pf.ou,s.pf.ac,s.pf.bk);
else{const z=d.sd+k*7;person(x,y,PSK[z%6],PSH[(z*3)%8],PPA[z%5],0,PHR[(z*5)%8],z%4,k<L?1:-1,z%5,0,0)}}
g=o}
