<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste GoatCounter</title>
<script data-goatcounter="https://olucasnx.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>body{font-family:sans-serif;font-size:20px;padding:20px;background:#fff;color:#000}p{margin:14px 0}</style>
</head>
<body>
<h2>Teste do GoatCounter</h2>
<p id="a">1) Script carregou: aguardando...</p>
<p id="b">2) Envio da visita: aguardando...</p>
<p>Espere 5 segundos e me mande um print desta tela.</p>
<script>
setTimeout(function(){
  document.getElementById('a').textContent='1) Script carregou: '+(window.goatcounter?'SIM':'NÃO');
  var i=new Image();
  i.onload=function(){document.getElementById('b').textContent='2) Envio da visita: OK'};
  i.onerror=function(){document.getElementById('b').textContent='2) Envio da visita: ERRO (bloqueado)'};
  i.src='https://olucasnx.goatcounter.com/count?p=/teste-pixel&t=Teste&r='+Math.random();
},3000);
</script>
</body>
</html>
